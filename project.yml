name: PocketCompanion
options:
  bundleIdPrefix: com.pocketcompanion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    APP_GROUP: group.com.pocketcompanion.shared
packages:
  PetCore:
    path: Packages/PetCore
targets:
  PocketCompanion:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: PetCore
      - target: CompanionWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PCAppGroup: $(APP_GROUP)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/PocketCompanion.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pocketcompanion.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketcompanion.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CompanionWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: PetCore
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PCAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CompanionWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pocketcompanion.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pocketcompanion.app.widget
schemes:
  PocketCompanion:
    build:
      targets:
        PocketCompanion: all
        CompanionWidget: all
